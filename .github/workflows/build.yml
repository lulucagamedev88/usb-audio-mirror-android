name: Debug Structure

on:
  workflow_dispatch:

jobs:
  list-files:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: List all files in repository
      run: |
        echo "=== CURRENT DIRECTORY ==="
        pwd
        echo "=== FILES IN ROOT ==="
        ls -la
        echo "=== RECURSIVE LIST ==="
        find . -maxdepth 3 -not -path '*/.*'
