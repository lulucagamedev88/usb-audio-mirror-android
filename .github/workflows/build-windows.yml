name: Build Windows Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build and Publish (Self-Contained)
      run: dotnet publish windows/LocalAudioServer/LocalAudioServer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

    - name: Upload Windows Build
      uses: actions/upload-artifact@v4
      with:
        name: LocalAudioServer-Windows-SelfContained
        path: ./publish/
